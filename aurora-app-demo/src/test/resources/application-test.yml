spring:
  datasource:
    url: jdbc:h2:mem:aurora;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

aurora:
  retrieval:
    store: memory
  storage:
    provider: none
  demo:
    seed-runtime: false
  agent:
    budget:
      maxToolCalls: 20
