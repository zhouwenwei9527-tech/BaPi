server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: aurora-app-demo
  datasource:
    url: ${AURORA_DB_URL:jdbc:mysql://127.0.0.1:3308/aurora?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${AURORA_DB_USER:aurora_app}
    password: ${AURORA_DB_PASSWORD:aurora_app_pw}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration,classpath:db/migration-mysql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

aurora:
  modules:
    rbac-core: true
    tool-registry: true
    agent-runtime: true
    retrieval: true
  agent:
    budget:
      maxToolCalls: 20
      maxTokens: 60000
      maxWallClockMs: 120000
      maxConsecutiveFailures: 3
  approval:
    ttlHours: 24
    allowSelfApproveWrite: false
  retrieval:
    store: pgvector
    overFetch: 2
    pg:
      url: ${AURORA_PG_URL:jdbc:postgresql://127.0.0.1:5433/aurora_vector}
      username: ${AURORA_PG_USER:aurora}
      password: ${AURORA_PG_PASSWORD:aurora_vector_pw}
  storage:
    provider: ${AURORA_STORAGE:minio}
    minio:
      endpoint: ${AURORA_MINIO_ENDPOINT:http://127.0.0.1:9000}
      access-key: ${AURORA_MINIO_KEY:aurora_minio}
      secret-key: ${AURORA_MINIO_SECRET:aurora_minio_pw}
      bucket: aurora-files
  demo:
    seed-runtime: true
